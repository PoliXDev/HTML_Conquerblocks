    <rect x="225" y="200" width="40" height="6" rx="3" fill="#FFC" opacity="0.8"/>
    <rect x="155" y="215" width="100" height="6" rx="3" fill="#CCC" opacity="0.7"/>
    <rect x="155" y="230" width="90" height="6" rx="3" fill="#58F" opacity="0.8"/>
    <rect x="255" y="230" width="60" height="6" rx="3" fill="#FF6B6B" opacity="0.8"/>
    <rect x="155" y="245" width="70" height="6" rx="3" fill="#4F8" opacity="0.8"/>
    <rect x="155" y="260" width="110" height="6" rx="3" fill="#CCC" opacity="0.7"/>
