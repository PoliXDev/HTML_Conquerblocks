  <circle cx="450" cy="200" r="25" fill="#58F" opacity="0.5"/>
  <circle cx="50" cy="250" r="18" fill="#FFC" opacity="0.5"/>
  
  <!-- Formas abstractas -->
  <path d="M40,40 L80,60 L60,90 L30,70 Z" fill="#58F" opacity="0.6"/>
  <path d="M420,320 L460,310 L470,350 L430,360 Z" fill="#FF6B6B" opacity="0.6"/>
