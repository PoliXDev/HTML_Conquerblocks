  <!-- Persona/Figura -->
  <circle cx="370" cy="140" r="30" fill="#FFF" opacity="0.8"/>
  <rect x="345" y="170" width="50" height="100" rx="15" fill="#FFF" opacity="0.8"/>
  <rect x="335" y="190" width="15" height="60" rx="7" fill="#FFF" opacity="0.8"/>
  <rect x="390" y="190" width="15" height="60" rx="7" fill="#FFF" opacity="0.8"/>
  
  <!-- Elementos flotantes -->
  <circle cx="100" cy="100" r="15" fill="#4F8" opacity="0.5"/>
