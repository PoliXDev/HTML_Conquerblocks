  <!-- Laptop -->
  <rect x="125" y="150" width="250" height="160" rx="8" fill="#444" stroke="#555" stroke-width="2"/>
  <rect x="135" y="160" width="230" height="130" fill="#222" stroke="#333" stroke-width="1"/>
  <rect x="100" y="310" width="300" height="15" rx="6" fill="#555"/>
  
  <!-- Pantalla con código -->
  <g>
    <!-- Líneas de código -->
    <rect x="155" y="170" width="80" height="6" rx="3" fill="#58F" opacity="0.8"/>
    <rect x="155" y="185" width="120" height="6" rx="3" fill="#FF6B6B" opacity="0.8"/>
    <rect x="185" y="185" width="30" height="6" rx="3" fill="#FFF" opacity="0.9"/>
